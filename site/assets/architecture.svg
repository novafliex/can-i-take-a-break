<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a8d86"/>
    </marker>
  </defs>
  <style>
    .box { fill:#fffdf7; stroke:#2b2b2b; stroke-width:2; rx:14; }
    .title { font-size:17px; font-weight:700; fill:#2b2b2b; }
    .sub { font-size:12.5px; fill:#5c5f58; }
    .label { font-size:12.5px; fill:#8a4b32; font-weight:600; }
    .zone { fill:none; stroke:#d8d3c4; stroke-width:1.6; stroke-dasharray:7 5; rx:18; }
    .zonetitle { font-size:13px; font-weight:700; fill:#8a8d86; letter-spacing:1px; }
  </style>

  <!-- 小程序端 -->
  <rect class="zone" x="30" y="40" width="330" height="330"/>
  <text class="zonetitle" x="52" y="70">微信小程序 · 原生开发（无框架）</text>
  <rect class="box" x="60" y="92" width="270" height="86" rx="14"/>
  <text class="title" x="80" y="122">8 个页面</text>
  <text class="sub" x="80" y="146">申请 · 投票 · 广场 · 我的</text>
  <text class="sub" x="80" y="164">详情 · 文章 · 隐私 · 管理中心</text>
  <rect class="box" x="60" y="210" width="270" height="120" rx="14"/>
  <text class="title" x="80" y="240">utils 层</text>
  <text class="sub" x="80" y="264">api.js：请求封装 · 自动登录</text>
  <text class="sub" x="80" y="282">401 重放 · 冷启动退避重试</text>
  <text class="sub" x="80" y="300">theme.js：三主题换肤</text>
  <text class="sub" x="80" y="318">notify.js：订阅消息授权</text>

  <!-- 后端 -->
  <rect class="zone" x="420" y="40" width="300" height="440"/>
  <text class="zonetitle" x="446" y="70">微信云托管 · CloudBase Run</text>
  <rect class="box" x="448" y="92" width="246" height="190" rx="14"/>
  <text class="title" x="470" y="124">Go 容器（单二进制）</text>
  <text class="sub" x="470" y="148">标准库 net/http · 零 Web 框架</text>
  <text class="sub" x="470" y="166">约 40 个 JSON 接口（/api/v1）</text>
  <text class="sub" x="470" y="184">HMAC 令牌 · 管理密钥鉴权</text>
  <text class="sub" x="470" y="202">审核编排（fail-closed）</text>
  <text class="sub" x="470" y="220">配额 · 投票事务 · 幂等结算</text>
  <text class="sub" x="470" y="238">订阅消息 · 备份/恢复 CLI</text>
  <text class="sub" x="470" y="256">/health · /health/ready</text>
  <rect class="box" x="448" y="330" width="246" height="92" rx="14"/>
  <text class="title" x="470" y="360">MySQL 8</text>
  <text class="sub" x="470" y="384">10 张业务表（bureau_*）</text>
  <text class="sub" x="470" y="402">投票主键防重 · 写序锁事务</text>
  <text class="sub" x="470" y="420">仅云托管内网可达</text>

  <!-- 微信开放能力 -->
  <rect class="zone" x="780" y="40" width="160" height="440"/>
  <text class="zonetitle" x="802" y="70">微信开放能力</text>
  <rect class="box" x="798" y="92" width="124" height="70" rx="14"/>
  <text class="sub" x="812" y="120">jscode2session</text>
  <text class="sub" x="812" y="140">登录 → openid</text>
  <rect class="box" x="798" y="200" width="124" height="70" rx="14"/>
  <text class="sub" x="812" y="228">msg_sec_check</text>
  <text class="sub" x="812" y="248">UGC 内容安全</text>
  <rect class="box" x="798" y="308" width="124" height="70" rx="14"/>
  <text class="sub" x="812" y="336">订阅消息</text>
  <text class="sub" x="812" y="356">授权额度制下发</text>

  <!-- 连线 -->
  <line x1="330" y1="270" x2="446" y2="187" stroke="#8a8d86" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text class="label" x="336" y="216">wx.cloud.callContainer（内网）</text>
  <line x1="570" y1="282" x2="570" y2="328" stroke="#8a8d86" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="696" y1="140" x2="796" y2="126" stroke="#8a8d86" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="696" y1="187" x2="796" y2="233" stroke="#8a8d86" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="696" y1="240" x2="796" y2="342" stroke="#8a8d86" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 底注 -->
  <text class="sub" x="40" y="530">公开展示架构图 · 今天能摆吗？（Can I Take a Break?）· 与代码核对于 2026-10-25 · 详见 docs/architecture.md</text>
</svg>
